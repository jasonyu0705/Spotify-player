; Spotify ESP controller
; Board: Hosyond 4.0" ESP32 display (E32R40T)
;   ESP32-WROOM-32E, ST7796 320x480 SPI LCD, XPT2046 resistive touch
;   (The Amazon listing says "ILI9341 240x320"; the board docs say ST7796 320x480.)
;
; Envs:
;   pio run -e controller -t upload -t monitor       -> src/ with Spotify (needs include/secrets.h)
;   pio run -e bringup -t upload -t monitor          -> testing/bringup/ (screen + touch test)
; lib/TouchCalibration is shared by both, so they use the same saved calibration.

[platformio]
default_envs = controller

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
; WiFi + TLS + the UI outgrow the default 1.25 MB app partition. huge_app keeps
; NVS at the same address, so the saved touch calibration survives.
board_build.partitions = huge_app.csv
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.2
    bodmer/TJpg_Decoder@1.1.0

; TFT_eSPI is configured here instead of editing its User_Setup.h.
; Pins are from the board's lcdwiki pin table. LCD and touch share one SPI bus.
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D USE_HSPI_PORT=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1
    ; If the color bars look like a photo negative, uncomment:
    ; -D TFT_INVERSION_ON=1
    ; If red and blue are swapped, uncomment:
    ; -D TFT_RGB_ORDER=TFT_BGR

[env:controller]

[env:bringup]
build_src_filter = -<*> +<../testing/bringup/>
